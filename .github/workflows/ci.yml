name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secret scan of the FULL history (and so of every new commit / PR commit). Rules: .gitleaks.toml.
  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          VERSION=8.30.1
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner --config .gitleaks.toml

  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Newest PostgreSQL major supported by Google Cloud SQL (see docs/migrating-to-cloud-sql.md).
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI database: not a secret. TEST_ URLs satisfy the test-DB guard; the run creates lms_test_1..N from the base name.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_test
      TEST_DATABASE_APP_URL: postgresql://lms_app:ci0lms0app0password0000@localhost:5432/lms_test
      DB_SSL: "off"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      # docs/permissions.md is generated from the code; fail when the committed file is stale
      - run: pnpm docs:permissions --check
      - run: pnpm typecheck
      - run: pnpm build

      # Same roles as `pnpm db:local:setup` creates on a developer machine.
      - name: Create the anon / authenticated roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lms_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL

      - run: pnpm test

  # Nightly / manual: the full suite three times in a row (flakiness check). Per-step work runs the
  # affected tests only; see "Verification policy" in CLAUDE.md.
  flakiness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_test
      TEST_DATABASE_APP_URL: postgresql://lms_app:ci0lms0app0password0000@localhost:5432/lms_test
      DB_SSL: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the anon / authenticated roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lms_test -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN" -c "CREATE ROLE authenticated NOLOGIN"
      - run: pnpm test
      - run: pnpm test
      - run: pnpm test
