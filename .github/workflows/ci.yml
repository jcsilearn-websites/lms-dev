name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Secret scan of the FULL history (and so of every new commit / PR commit). Rules: .gitleaks.toml.
  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          VERSION=8.30.1
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --no-banner --config .gitleaks.toml

  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # PostgreSQL 17 everywhere: local, CI and Cloud SQL (docs/adr/0014-postgresql-17.md). The code refuses other majors.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI database: not a secret. TEST_ URLs satisfy the test-DB guard; the run creates lms_test_1..N from the base name.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_test
      TEST_DATABASE_APP_URL: postgresql://lms_app:ci0lms0app0password0000@localhost:5432/lms_test
      DB_SSL: "off"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      # docs/permissions.md is generated from the code; fail when the committed file is stale
      - run: pnpm docs:permissions --check
      - run: pnpm typecheck
      - run: pnpm build

      # Same roles as `pnpm db:local:setup` creates on a developer machine.
      - name: Create the anon / authenticated roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lms_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL

      - run: pnpm test

  # Bundle budgets: login page <= 125 KB gzip (initial load), every route <= 150 KB gzip.
  bundle-size:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lms/frontend run build
      - run: pnpm bundle:check

  # Playwright end-to-end tests (headless Chromium) against the real API, worker and PostgreSQL.
  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database: not a secret. The E2E and Lighthouse runs create lms_e2e next to lms_test
      # on this server (frontend/scripts/stack.mjs, guarded like the test databases).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_test
      TEST_DATABASE_APP_URL: postgresql://lms_app:ci0lms0app0password0000@localhost:5432/lms_test
      DB_SSL: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @lms/frontend exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Keep the Playwright report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e-report
            frontend/e2e-results
          retention-days: 7

  # Lighthouse (mobile preset) on the login page and the members list: performance >= 90, accessibility >= 95.
  lighthouse:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database: not a secret. The E2E and Lighthouse runs create lms_e2e next to lms_test
      # on this server (frontend/scripts/stack.mjs, guarded like the test databases).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_test
      TEST_DATABASE_APP_URL: postgresql://lms_app:ci0lms0app0password0000@localhost:5432/lms_test
      DB_SSL: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright (Lighthouse drives it)
        run: pnpm --filter @lms/frontend exec playwright install --with-deps chromium
      - run: pnpm --filter @lms/frontend run lighthouse:ci
      - name: Keep the scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-summary
          path: frontend/lighthouse-summary.json
          if-no-files-found: ignore
          retention-days: 14

  # Nightly / manual: the full suite three times in a row (flakiness check). Per-step work runs the
  # affected tests only; see "Verification policy" in CLAUDE.md.
  flakiness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_test
      TEST_DATABASE_APP_URL: postgresql://lms_app:ci0lms0app0password0000@localhost:5432/lms_test
      DB_SSL: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the anon / authenticated roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lms_test -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN" -c "CREATE ROLE authenticated NOLOGIN"
      - run: pnpm test
      - run: pnpm test
      - run: pnpm test
